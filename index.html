<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test micro — Mes Colis Surprises</title><style>body{font-family:system-ui;background:#fcf4f7;color:#55283e;margin:0;padding:28px}main{max-width:520px;margin:35px auto;background:white;border-radius:22px;padding:28px;box-shadow:0 8px 35px #55283e14}h1{font-size:25px}button{width:100%;background:#7b3152;color:white;border:0;border-radius:14px;padding:22px;font-size:18px;font-weight:bold}#status{margin-top:22px;white-space:pre-wrap}#words{background:#f9edf2;border-radius:12px;padding:14px;min-height:60px}</style></head><body><main><h1>🎁 Test micro — Mes Colis Surprises</h1><p>Appuie sur le bouton, puis dis « Sophie Martin, mascara, bougie, porte-clés ».</p><button id="mic">🎤 Dicter</button><p id="status" aria-live="polite">Prêt pour le test.</p><div id="words" aria-live="polite">Les mots reconnus apparaîtront ici.</div><p style="font-size:13px">Cette page ne transmet ni n'enregistre de données. Teste-la depuis une adresse HTTPS, idéalement dans Chrome sur Android.</p></main><script>const btn=document.getElementById('mic'),status=document.getElementById('status'),words=document.getElementById('words');let rec;btn.addEventListener('click',()=>{const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){status.textContent='Reconnaissance vocale non prise en charge par ce navigateur.';return;}try{rec=new Speech();rec.lang='fr-FR';rec.interimResults=false;rec.maxAlternatives=1;rec.onstart=()=>{status.textContent='🎤 Je vous écoute…';btn.disabled=true};rec.onresult=e=>{words.textContent=e.results[0][0].transcript;status.textContent='✅ Voix reconnue !'};rec.onerror=e=>{status.textContent='❌ Erreur : '+e.error+(e.message?' — '+e.message:'')};rec.onend=()=>{btn.disabled=false};rec.start()}catch(e){status.textContent='❌ '+e.message;btn.disabled=false}})</script></body></html>
